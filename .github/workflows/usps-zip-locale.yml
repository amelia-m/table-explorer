name: USPS ZIP reference check

# Weekly: has USPS published a newer ZIP Locale Detail file than the one the
# ZIP checks use? USPS replaces it monthly, and a stale reference list reports
# new ZIPs as "not in the reference list" without saying why.
#
# When it has, this opens one issue (and never a second while one is open).
# When the page cannot be reached or read, it leaves a warning on the run and
# opens nothing, so a USPS outage does not file issues.

"on":
  schedule:
    # Mondays 14:00 UTC
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  RENV_CONFIG_AUTOLOADER_ENABLED: "FALSE"

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # The check reads only its own record, so it needs yaml and nothing
      # from the package; setup-r points install.packages at binaries
      - name: Install the one package the check needs
        run: Rscript -e 'install.packages("yaml")'

      - name: Compare the USPS page with the recorded file
        id: check
        shell: bash
        run: |
          set +e
          out=$(Rscript dev/check_usps_zip_locale.R 2>&1)
          code=$?
          set -e
          echo "$out"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          {
            echo "message<<EOF"
            echo "$out"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Open an issue when USPS has published a newer file
        if: steps.check.outputs.code == '10'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MESSAGE: ${{ steps.check.outputs.message }}
        run: |
          title="USPS ZIP Locale Detail has a newer file"
          open=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq 'length')
          if [ "$open" != "0" ]; then
            echo "An issue is already open; not opening another."
            exit 0
          fi
          gh issue create --title "$title" --body "$(printf '%s\n\n%s\n%s\n%s\n' \
            "$MESSAGE" \
            "To update: download the file into docs/ref/, then run" \
            "Rscript dev/check_usps_zip_locale.R --record" \
            "and commit the result.")"

      - name: Warn when the page could not be checked
        if: steps.check.outputs.code == '20'
        shell: bash
        run: |
          echo "::warning::USPS ZIP reference check could not complete; see the step above."
