name: R CI

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: Imports
          extra-packages: |
            any::devtools
            any::testthat
            any::jsonlite
            any::yaml
            any::RSQLite
            any::stringdist

      - name: Run test suite
        shell: Rscript {0}
        run: devtools::test()
