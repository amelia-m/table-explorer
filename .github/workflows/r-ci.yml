name: R CI

"on":
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # The repository carries an renv.lock, but CI installs from DESCRIPTION.
  # Without this renv bootstraps itself into a library that is not there
  # and the session dies before the first test runs.
  RENV_CONFIG_AUTOLOADER_ENABLED: "FALSE"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # The Access tests read a real .accdb with mdbtools; without it they skip
      - name: Install mdbtools
        run: sudo apt-get update && sudo apt-get install -y mdbtools

      - name: Install package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: Imports
          # The Excel reader's tests need readxl and openxlsx: readxl to read,
          # openxlsx to write the fixture. Without them every Excel test skips
          # here and CI reports green on code it never ran. The Access reader
          # needs RJDBC the same way. This comment sits outside the block
          # below on purpose: every line inside a `|` block, a `#` line
          # included, is passed on as a package name.
          extra-packages: |
            any::devtools
            any::testthat
            any::pkgload
            any::jsonlite
            any::yaml
            any::RSQLite
            any::stringdist
            any::readxl
            any::openxlsx
            any::RJDBC

      # The app downloads these on first use; a test must not
      - name: Fetch UCanAccess jars
        shell: Rscript {0}
        run: |
          pkgload::load_all(quiet = TRUE)
          if (!ensure_ucanaccess_jars(access_jar_dir(), message)) stop("jars missing")

      # The tests compare against this key, so the key is held to the file first
      - name: Check the Access fixture against its key
        run: Rscript dev/fixtures/access/check_answer_key.R tests/testthat/fixtures/access_fixture.mdb

      - name: Run test suite
        shell: Rscript {0}
        run: |
          res <- testthat::test_local(reporter = "summary", stop_on_failure = FALSE)
          df <- as.data.frame(res)
          cat("failed:", sum(df$failed), " errors:", sum(df$error), "\n")
          if (sum(df$failed) > 0 || sum(df$error) > 0) quit(status = 1)
          access <- df[grepl("real (Jet 3 )?\\.(accdb|mdb)", df$test), ]
          if (nrow(access) == 0) stop("no real Access test ran")
          if (any(access$skipped)) stop("skipped: ", toString(access$test[access$skipped]))

      # The real regression guard for detection: a scoring change that
      # loses a link, or invents one, shows up here and not in the tests
      - name: Score detection against the fixture
        shell: Rscript {0}
        run: |
          out <- system2("Rscript", "dev/fixtures/score_detection.R", stdout = TRUE)
          cat(out, sep = "\n")
          line <- grep("^medium\\+:", out, value = TRUE)
          if (length(line) != 1) stop("scorer produced no medium+ line")
          real <- as.integer(sub(".*real: ([0-9]+) of ([0-9]+).*", "\\1", line))
          want <- as.integer(sub(".*real: ([0-9]+) of ([0-9]+).*", "\\2", line))
          false <- as.integer(sub(".*false: ([0-9]+).*", "\\1", line))
          if (is.na(real) || is.na(want) || is.na(false)) stop("could not parse: ", line)
          if (real < want) stop("detection lost links: ", real, " of ", want)
          if (false > 0) stop("detection invented ", false, " false links")
