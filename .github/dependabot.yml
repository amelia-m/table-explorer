version: 2

# Dependabot has no CRAN or renv ecosystem, so DESCRIPTION and renv.lock
# are invisible to it and stay a manual job. These two are what it can
# actually see here.
updates:
  # The CI workflow pins actions by major tag. This catches a pinned
  # action going stale or being deprecated, which otherwise surfaces as a
  # workflow that stops running.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci"
    labels:
      - dependencies

  # The Python app is secondary and changes only when asked, so monthly
  # is enough to hear about an advisory without a stream of pull requests
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore"
    labels:
      - dependencies
    open-pull-requests-limit: 3
