<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" role="img" aria-label="Primary keys stated by schema files, data-dict files and databases override detection unless the loaded data contradicts them."><title>Primary keys stated by schema files, data-dict files and databases override detection unless the loaded data contradicts them.</title><style>
svg { --bg:#ffffff; --fg:#18212c; --muted:#5a6776; --node:#ffffff; --state:#e6eef8; --file:#f3f1ea;
  --priv:#9f3a2c; --priv-bg:#f8e7e3; --shown:#2f6b45; --shown-bg:#e3f1e7; --accent:#b25a00; }
@media (prefers-color-scheme: dark) {
  svg { --bg:#161d26; --fg:#e3e8ee; --muted:#93a0ae; --node:#1a222d; --state:#18283b; --file:#242219;
    --priv:#f09a8a; --priv-bg:#3a1f1b; --shown:#8fd3a5; --shown-bg:#173024; --accent:#f0a346; }
}
.bg { fill: var(--bg); }
.t { font: 13px "IBM Plex Sans", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--fg); }
.t.mono, .mono { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }
.t.small { font-size: 11.5px; }
.t.head { font: 600 13px "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .04em; fill: var(--muted); }
.muted { fill: var(--muted); }
rect { stroke-width: 1.3; }
.node, .q { fill: var(--node); stroke: var(--fg); }
.q { stroke-width: 1.6; }
.state { fill: var(--state); stroke: var(--fg); }
.file { fill: var(--file); stroke: var(--fg); stroke-dasharray: 4 3; }
.priv { fill: var(--priv-bg); stroke: var(--priv); }
.priv-t { fill: var(--priv); font-weight: 600; }
.shown { fill: var(--shown-bg); stroke: var(--shown); }
.shown-t { fill: var(--shown); font-weight: 600; }
.priv-t.small, .shown-t.small { font-weight: 400; }
.edge { stroke: var(--fg); stroke-width: 1.3; opacity: .75; }
.edge-l { fill: var(--muted); }
.edge-accent { stroke: var(--accent); stroke-width: 2; }
.edge-accent-l, .accent-t { fill: var(--accent); }
.stopbar { stroke: var(--accent); stroke-width: 3; }
.ah { fill: var(--fg); }
.ah-accent { fill: var(--accent); }
</style><defs><marker id="arrow-f3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><marker id="accent-f3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah-accent"/></marker></defs><rect class="bg" x="0" y="0" width="860" height="330" rx="8"/><rect class="node" x="20" y="30" width="200" height="48" rx="6"/><text class="t node-t" x="120.0" y="50.5" text-anchor="middle">Schema JSON / YAML</text><text class="t small node-t" x="120.0" y="65.5" text-anchor="middle">primary_key: true</text><rect class="node" x="20" y="92" width="200" height="48" rx="6"/><text class="t node-t" x="120.0" y="112.5" text-anchor="middle">data-dict file</text><text class="t small node-t" x="120.0" y="127.5" text-anchor="middle">constraints: [primary_key]</text><rect class="node" x="20" y="154" width="200" height="48" rx="6"/><text class="t node-t" x="120.0" y="174.5" text-anchor="middle">Database connection</text><text class="t small node-t" x="120.0" y="189.5" text-anchor="middle">PRIMARY KEY constraints</text><rect class="state" x="290" y="92" width="150" height="48" rx="6"/><text class="t mono state-t" x="365.0" y="112.5" text-anchor="middle">declared_pks_rv</text><text class="t small state-t" x="365.0" y="127.5" text-anchor="middle">saved with session</text><polyline class="edge" points="220,54 255,54 255,116 290,116" fill="none" marker-end="url(#arrow-f3)"/><polyline class="edge" points="220,116 255,116 255,116 290,116" fill="none" marker-end="url(#arrow-f3)"/><polyline class="edge" points="220,178 255,178 255,116 290,116" fill="none" marker-end="url(#arrow-f3)"/><rect class="node" x="290" y="230" width="150" height="48" rx="6"/><text class="t mono node-t" x="365.0" y="250.5" text-anchor="middle">detect_pks()</text><text class="t small node-t" x="365.0" y="265.5" text-anchor="middle">names + uniqueness</text><rect class="state" x="510" y="150" width="130" height="48" rx="6"/><text class="t mono state-t" x="575.0" y="178.0" text-anchor="middle">pk_map_rv</text><polyline class="edge" points="440,116 475,116 475,166 510,166" fill="none" marker-end="url(#arrow-f3)"/><text class="t small edge-l" x="478" y="110" text-anchor="start">overrides</text><polyline class="edge" points="440,254 475,254 475,184 510,184" fill="none" marker-end="url(#arrow-f3)"/><text class="t small edge-l" x="478" y="270" text-anchor="start">candidates</text><rect class="shown" x="700" y="80" width="145" height="58" rx="6"/><text class="t shown-t" x="772.5" y="105.5" text-anchor="middle">declared key</text><text class="t small shown-t" x="772.5" y="120.5" text-anchor="middle">data agrees with it</text><rect class="node" x="700" y="210" width="145" height="58" rx="6"/><text class="t node-t" x="772.5" y="235.5" text-anchor="middle">detected key</text><text class="t small node-t" x="772.5" y="250.5" text-anchor="middle">data contradicts it</text><text class="t small muted mono" x="575" y="216" text-anchor="middle">checked in erd_model()</text><polyline class="edge" points="640,166 670,166 670,109 700,109" fill="none" marker-end="url(#arrow-f3)"/><polyline class="edge-accent" points="640,184 670,184 670,239 700,239" fill="none" marker-end="url(#accent-f3)"/><text class="t small accent-t" x="772" y="286" text-anchor="middle">duplicates or NA</text><text class="t small muted" x="20" y="312" text-anchor="start">A data-dict table with no key stays keyless only while it has no rows.</text></svg>
