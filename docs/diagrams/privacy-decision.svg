<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 560" width="780" height="560" role="img" aria-label="Decision path for one column&#x27;s privacy: your Private choice, then your Not private choice if the data is unchanged, then name patterns, then the automatic flag and your review of it."><title>Decision path for one column&#x27;s privacy: your Private choice, then your Not private choice if the data is unchanged, then name patterns, then the automatic flag and your review of it.</title><style>
svg { --bg:#ffffff; --fg:#18212c; --muted:#5a6776; --node:#ffffff; --state:#e6eef8; --file:#f3f1ea;
  --priv:#9f3a2c; --priv-bg:#f8e7e3; --shown:#2f6b45; --shown-bg:#e3f1e7; --accent:#b25a00; }
@media (prefers-color-scheme: dark) {
  svg { --bg:#161d26; --fg:#e3e8ee; --muted:#93a0ae; --node:#1a222d; --state:#18283b; --file:#242219;
    --priv:#f09a8a; --priv-bg:#3a1f1b; --shown:#8fd3a5; --shown-bg:#173024; --accent:#f0a346; }
}
.bg { fill: var(--bg); }
.t { font: 13px "IBM Plex Sans", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--fg); }
.t.mono, .mono { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }
.t.small { font-size: 11.5px; }
.t.head { font: 600 13px "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .04em; fill: var(--muted); }
.muted { fill: var(--muted); }
rect { stroke-width: 1.3; }
.node, .q { fill: var(--node); stroke: var(--fg); }
.q { stroke-width: 1.6; }
.state { fill: var(--state); stroke: var(--fg); }
.file { fill: var(--file); stroke: var(--fg); stroke-dasharray: 4 3; }
.priv { fill: var(--priv-bg); stroke: var(--priv); }
.priv-t { fill: var(--priv); font-weight: 600; }
.shown { fill: var(--shown-bg); stroke: var(--shown); }
.shown-t { fill: var(--shown); font-weight: 600; }
.priv-t.small, .shown-t.small { font-weight: 400; }
.edge { stroke: var(--fg); stroke-width: 1.3; opacity: .75; }
.edge-l { fill: var(--muted); }
.edge-accent { stroke: var(--accent); stroke-width: 2; }
.edge-accent-l, .accent-t { fill: var(--accent); }
.stopbar { stroke: var(--accent); stroke-width: 3; }
.ah { fill: var(--fg); }
.ah-accent { fill: var(--accent); }
</style><defs><marker id="arrow-f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><marker id="accent-f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah-accent"/></marker></defs><rect class="bg" x="0" y="0" width="780" height="560" rx="8"/><rect class="q" x="30" y="30" width="300" height="50" rx="6"/><text class="t q-t" x="180.0" y="51.5" text-anchor="middle">Marked Private by you,</text><text class="t q-t" x="180.0" y="66.5" text-anchor="middle">or restricted in an imported file?</text><rect class="q" x="30" y="120" width="300" height="50" rx="6"/><text class="t q-t" x="180.0" y="141.5" text-anchor="middle">Marked Not private by you</text><text class="t q-t" x="180.0" y="156.5" text-anchor="middle">for this exact data?</text><rect class="q" x="30" y="210" width="300" height="50" rx="6"/><text class="t q-t" x="180.0" y="231.5" text-anchor="middle">Matches one of your</text><text class="t q-t" x="180.0" y="246.5" text-anchor="middle">private name patterns?</text><rect class="q" x="30" y="300" width="300" height="50" rx="6"/><text class="t q-t" x="180.0" y="321.5" text-anchor="middle">Flagged automatically?</text><text class="t q-t" x="180.0" y="336.5" text-anchor="middle">(name word or value pattern)</text><rect class="q" x="30" y="390" width="300" height="50" rx="6"/><text class="t q-t" x="180.0" y="419.0" text-anchor="middle">Your review of the flag</text><rect class="priv" x="560" y="30" width="200" height="50" rx="6"/><text class="t priv-t" x="660.0" y="51.5" text-anchor="middle">private</text><text class="t small priv-t" x="660.0" y="66.5" text-anchor="middle">set by you / from file</text><rect class="shown" x="560" y="120" width="200" height="50" rx="6"/><text class="t shown-t" x="660.0" y="141.5" text-anchor="middle">shown</text><text class="t small shown-t" x="660.0" y="156.5" text-anchor="middle">examples and range</text><rect class="priv" x="560" y="210" width="200" height="50" rx="6"/><text class="t priv-t" x="660.0" y="231.5" text-anchor="middle">private</text><text class="t small priv-t" x="660.0" y="246.5" text-anchor="middle">name pattern</text><rect class="shown" x="560" y="300" width="200" height="50" rx="6"/><text class="t shown-t" x="660.0" y="321.5" text-anchor="middle">shown</text><text class="t small shown-t" x="660.0" y="336.5" text-anchor="middle">not flagged</text><polyline class="edge" points="330,55.0 560,55.0" fill="none" marker-end="url(#arrow-f1)"/><text class="t small edge-l" x="445.0" y="49.0" text-anchor="middle">yes</text><polyline class="edge" points="330,145.0 560,145.0" fill="none" marker-end="url(#arrow-f1)"/><text class="t small edge-l" x="445.0" y="139.0" text-anchor="middle">yes, data hash matches</text><polyline class="edge" points="330,235.0 560,235.0" fill="none" marker-end="url(#arrow-f1)"/><text class="t small edge-l" x="445.0" y="229.0" text-anchor="middle">yes</text><polyline class="edge" points="330,325.0 560,325.0" fill="none" marker-end="url(#arrow-f1)"/><text class="t small edge-l" x="445.0" y="319.0" text-anchor="middle">no</text><polyline class="edge" points="180.0,80 180.0,120" fill="none" marker-end="url(#arrow-f1)"/><text class="t small edge-l" x="188.0" y="104.0" text-anchor="start">no</text><polyline class="edge" points="180.0,260 180.0,300" fill="none" marker-end="url(#arrow-f1)"/><text class="t small edge-l" x="188.0" y="284.0" text-anchor="start">no</text><polyline class="edge" points="180.0,350 180.0,390" fill="none" marker-end="url(#arrow-f1)"/><text class="t small edge-l" x="188.0" y="374.0" text-anchor="start">yes</text><polyline class="edge-accent" points="180.0,170 180.0,210" fill="none" marker-end="url(#accent-f1)"/><text class="t small edge-accent-l" x="188.0" y="194.0" text-anchor="start">no, or the data has changed since</text><rect class="priv" x="560" y="370" width="200" height="44" rx="6"/><text class="t priv-t" x="660.0" y="388.5" text-anchor="middle">private</text><text class="t small priv-t" x="660.0" y="403.5" text-anchor="middle">confirmed</text><rect class="shown" x="560" y="430" width="200" height="44" rx="6"/><text class="t shown-t" x="660.0" y="448.5" text-anchor="middle">shown</text><text class="t small shown-t" x="660.0" y="463.5" text-anchor="middle">not personal, same data</text><rect class="priv" x="560" y="490" width="200" height="44" rx="6"/><text class="t priv-t" x="660.0" y="508.5" text-anchor="middle">private</text><text class="t small priv-t" x="660.0" y="523.5" text-anchor="middle">until you review</text><polyline class="edge" points="330,415.0 370,415.0" fill="none"/><line class="edge" x1="370" y1="392" x2="370" y2="452"/><line class="edge-accent" x1="370" y1="452" x2="370" y2="512"/><polyline class="edge" points="370,392 560,392" fill="none" marker-end="url(#arrow-f1)"/><text class="t small edge-l" x="382" y="386" text-anchor="start">confirmed</text><polyline class="edge" points="370,452 560,452" fill="none" marker-end="url(#arrow-f1)"/><text class="t small edge-l" x="382" y="446" text-anchor="start">not personal, same data</text><polyline class="edge-accent" points="370,512 560,512" fill="none" marker-end="url(#accent-f1)"/><text class="t small edge-accent-l" x="382" y="506" text-anchor="start">not reviewed, or data changed</text></svg>
