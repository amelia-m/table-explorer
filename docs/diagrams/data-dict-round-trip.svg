<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" role="img" aria-label="What an export to data-dict YAML and a re-import into a fresh app carry across, and what stops on the way."><title>What an export to data-dict YAML and a re-import into a fresh app carry across, and what stops on the way.</title><style>
svg { --bg:#ffffff; --fg:#18212c; --muted:#5a6776; --node:#ffffff; --state:#e6eef8; --file:#f3f1ea;
  --priv:#9f3a2c; --priv-bg:#f8e7e3; --shown:#2f6b45; --shown-bg:#e3f1e7; --accent:#b25a00; }
@media (prefers-color-scheme: dark) {
  svg { --bg:#161d26; --fg:#e3e8ee; --muted:#93a0ae; --node:#1a222d; --state:#18283b; --file:#242219;
    --priv:#f09a8a; --priv-bg:#3a1f1b; --shown:#8fd3a5; --shown-bg:#173024; --accent:#f0a346; }
}
.bg { fill: var(--bg); }
.t { font: 13px "IBM Plex Sans", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--fg); }
.t.mono, .mono { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }
.t.small { font-size: 11.5px; }
.t.head { font: 600 13px "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .04em; fill: var(--muted); }
.muted { fill: var(--muted); }
rect { stroke-width: 1.3; }
.node, .q { fill: var(--node); stroke: var(--fg); }
.q { stroke-width: 1.6; }
.state { fill: var(--state); stroke: var(--fg); }
.file { fill: var(--file); stroke: var(--fg); stroke-dasharray: 4 3; }
.priv { fill: var(--priv-bg); stroke: var(--priv); }
.priv-t { fill: var(--priv); font-weight: 600; }
.shown { fill: var(--shown-bg); stroke: var(--shown); }
.shown-t { fill: var(--shown); font-weight: 600; }
.priv-t.small, .shown-t.small { font-weight: 400; }
.edge { stroke: var(--fg); stroke-width: 1.3; opacity: .75; }
.edge-l { fill: var(--muted); }
.edge-accent { stroke: var(--accent); stroke-width: 2; }
.edge-accent-l, .accent-t { fill: var(--accent); }
.stopbar { stroke: var(--accent); stroke-width: 3; }
.ah { fill: var(--fg); }
.ah-accent { fill: var(--accent); }
</style><defs><marker id="arrow-f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah"/></marker><marker id="accent-f2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="ah-accent"/></marker></defs><rect class="bg" x="0" y="0" width="860" height="470" rx="8"/><text class="t head" x="135.0" y="26" text-anchor="middle">This app, with data</text><text class="t head" x="430.0" y="26" text-anchor="middle">data-dict.yaml</text><text class="t head" x="725.0" y="26" text-anchor="middle">A fresh app, no rows yet</text><rect class="node" x="20" y="46" width="230" height="34" rx="6"/><text class="t node-t" x="135.0" y="67.0" text-anchor="middle">Tables, column types</text><rect class="file" x="315" y="46" width="230" height="34" rx="6"/><text class="t mono file-t" x="430.0" y="67.0" text-anchor="middle">tables[].columns[].type</text><polyline class="edge" points="250,63.0 315,63.0" fill="none" marker-end="url(#arrow-f2)"/><rect class="node" x="610" y="46" width="230" height="34" rx="6"/><text class="t node-t" x="725.0" y="67.0" text-anchor="middle">empty tables of that type</text><polyline class="edge" points="545,63.0 610,63.0" fill="none" marker-end="url(#arrow-f2)"/><rect class="node" x="20" y="92" width="230" height="34" rx="6"/><text class="t node-t" x="135.0" y="113.0" text-anchor="middle">Primary keys</text><rect class="file" x="315" y="92" width="230" height="34" rx="6"/><text class="t mono file-t" x="430.0" y="113.0" text-anchor="middle">constraints: [primary_key]</text><polyline class="edge" points="250,109.0 315,109.0" fill="none" marker-end="url(#arrow-f2)"/><rect class="node" x="610" y="92" width="230" height="34" rx="6"/><text class="t node-t" x="725.0" y="113.0" text-anchor="middle">declared keys</text><polyline class="edge" points="545,109.0 610,109.0" fill="none" marker-end="url(#arrow-f2)"/><rect class="node" x="20" y="138" width="230" height="34" rx="6"/><text class="t node-t" x="135.0" y="159.0" text-anchor="middle">Declared, manual, confirmed links</text><rect class="file" x="315" y="138" width="230" height="34" rx="6"/><text class="t mono file-t" x="430.0" y="159.0" text-anchor="middle">relationships: join</text><polyline class="edge" points="250,155.0 315,155.0" fill="none" marker-end="url(#arrow-f2)"/><rect class="node" x="610" y="138" width="230" height="34" rx="6"/><text class="t node-t" x="725.0" y="159.0" text-anchor="middle">declared links</text><polyline class="edge" points="545,155.0 610,155.0" fill="none" marker-end="url(#arrow-f2)"/><rect class="node" x="20" y="184" width="230" height="34" rx="6"/><text class="t node-t" x="135.0" y="205.0" text-anchor="middle">Labels, descriptions, units</text><rect class="file" x="315" y="184" width="230" height="34" rx="6"/><text class="t mono file-t" x="430.0" y="205.0" text-anchor="middle">label / description / units</text><polyline class="edge" points="250,201.0 315,201.0" fill="none" marker-end="url(#arrow-f2)"/><rect class="node" x="610" y="184" width="230" height="34" rx="6"/><text class="t node-t" x="725.0" y="205.0" text-anchor="middle">dictionary, empty fields only</text><polyline class="edge" points="545,201.0 610,201.0" fill="none" marker-end="url(#arrow-f2)"/><rect class="node" x="20" y="230" width="230" height="34" rx="6"/><text class="t node-t" x="135.0" y="251.0" text-anchor="middle">Private columns</text><rect class="file" x="315" y="230" width="230" height="34" rx="6"/><text class="t mono file-t" x="430.0" y="251.0" text-anchor="middle">display: restricted</text><polyline class="edge" points="250,247.0 315,247.0" fill="none" marker-end="url(#arrow-f2)"/><rect class="node" x="610" y="230" width="230" height="34" rx="6"/><text class="t node-t" x="725.0" y="251.0" text-anchor="middle">private, unless you chose</text><polyline class="edge" points="545,247.0 610,247.0" fill="none" marker-end="url(#arrow-f2)"/><rect class="node" x="20" y="276" width="230" height="34" rx="6"/><text class="t node-t" x="135.0" y="297.0" text-anchor="middle">Real example values</text><rect class="file" x="315" y="276" width="230" height="34" rx="6"/><text class="t mono file-t" x="430.0" y="297.0" text-anchor="middle">placeholders + todo</text><polyline class="edge" points="250,293.0 315,293.0" fill="none" marker-end="url(#arrow-f2)"/><polyline class="edge-accent" points="545,293.0 579,293.0" fill="none"/><line class="stopbar" x1="579" y1="284.0" x2="579" y2="302.0"/><text class="t small accent-t" x="589" y="297.0" text-anchor="start">not imported</text><rect class="node" x="20" y="322" width="230" height="34" rx="6"/><text class="t node-t" x="135.0" y="343.0" text-anchor="middle">Unconfirmed or non-key links</text><rect class="file" x="315" y="322" width="230" height="34" rx="6"/><text class="t mono file-t" x="430.0" y="343.0" text-anchor="middle">todo</text><polyline class="edge" points="250,339.0 315,339.0" fill="none" marker-end="url(#arrow-f2)"/><polyline class="edge-accent" points="545,339.0 579,339.0" fill="none"/><line class="stopbar" x1="579" y1="330.0" x2="579" y2="348.0"/><text class="t small accent-t" x="589" y="343.0" text-anchor="start">not imported</text><rect class="node" x="20" y="368" width="230" height="34" rx="6"/><text class="t node-t" x="135.0" y="389.0" text-anchor="middle">Tables with no columns</text><rect class="file" x="315" y="368" width="230" height="34" rx="6"/><text class="t mono file-t" x="430.0" y="389.0" text-anchor="middle">todo</text><polyline class="edge" points="250,385.0 315,385.0" fill="none" marker-end="url(#arrow-f2)"/><polyline class="edge-accent" points="545,385.0 579,385.0" fill="none"/><line class="stopbar" x1="579" y1="376.0" x2="579" y2="394.0"/><text class="t small accent-t" x="589" y="389.0" text-anchor="start">not imported</text><text class="t small muted" x="20" y="424" text-anchor="start">An import never overwrites your own Private / Not private choice.</text></svg>
